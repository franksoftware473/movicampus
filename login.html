<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MoviCampus — Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a class="brand" href="login.html"><span class="dot"></span>MoviCampus</a>
      <p class="auth-sub">Movilidad universitaria, sin sorpresas</p>
      <label>Correo institucional</label>
      <input type="email" placeholder="nombre@ibero.edu.co">
      <label>Contraseña</label>
      <input type="password" placeholder="••••••••">
      <a href="panel.html" class="btn btn-primary btn-block" style="margin-top:22px;">Iniciar sesión</a>
      <p style="text-align:center; font-size:13px; color:#6B7280; margin-top:18px;">
        ¿No tienes cuenta? <a href="registro.html" style="color:#2E75B6; font-weight:600; text-decoration:none;">Regístrate</a>
      </p>
    </div>
  </div>
</body>
</html>
