<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoviCampus — Mi perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="perfil">
<div class="app">
  <header class="topbar">
    <a class="brand" href="panel.html"><span class="dot"></span>MoviCampus</a>
    <nav class="mainnav" aria-label="Navegación principal">
      <a href="panel.html">Inicio</a>
      <a href="buscar.html">Buscar rutas</a>
      <a href="perfil.html" class="active" aria-current="page">Favoritos</a>
      <a href="admin-rutas.html" data-solo-admin hidden>Modo administrador</a>
    </nav>
    <div class="user-chip"><span class="avatar" id="user-avatar" aria-hidden="true"></span> <span id="user-name"></span> <button type="button" class="chip-link" id="logout">Salir</button></div>
  </header>
  <main>
    <h1>Mi perfil</h1>
    <p class="lead">Tus datos y las rutas que guardaste como favoritas.</p>

    <div class="grid-2">
      <form class="card" id="form-perfil">
        <h2>Datos de la cuenta</h2>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" autocomplete="name" required>
        <label for="correo">Correo institucional</label>
        <input type="email" id="correo" readonly>
        <label for="rol">Rol</label>
        <input type="text" id="rol" readonly>
        <button type="submit" class="btn btn-secondary btn-block" style="margin-top:18px;">Guardar cambios</button>
        <div id="msg" class="msg" role="status"></div>
      </form>

      <div class="card">
        <h2>Rutas favoritas</h2>
        <div id="favoritas"></div>
        <a href="buscar.html" class="btn btn-primary btn-block" style="margin-top:14px;">Buscar más rutas</a>
      </div>
    </div>
  </main>
  <footer class="note">MVP funcional — MoviCampus · Proyecto tecnológico integrador</footer>
</div>
</body>
</html>
