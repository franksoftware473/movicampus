<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MoviCampus — Crear cuenta</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="width:420px;">
      <a class="brand" href="login.html"><span class="dot"></span>MoviCampus</a>
      <p class="auth-sub">Crea tu cuenta para consultar rutas y horarios</p>
      <label>Nombre completo</label>
      <input type="text" placeholder="Nombre y apellido">
      <label>Correo institucional</label>
      <input type="email" placeholder="nombre@ibero.edu.co">
      <label>Rol</label>
      <select>
        <option>Estudiante</option>
        <option>Docente</option>
        <option>Personal administrativo</option>
      </select>
      <label>Contraseña</label>
      <input type="password" placeholder="Crea una contraseña">
      <a href="panel.html" class="btn btn-primary btn-block" style="margin-top:22px;">Crear cuenta</a>
      <p style="text-align:center; font-size:13px; color:#6B7280; margin-top:18px;">
        ¿Ya tienes cuenta? <a href="login.html" style="color:#2E75B6; font-weight:600; text-decoration:none;">Inicia sesión</a>
      </p>
    </div>
  </div>
</body>
</html>
